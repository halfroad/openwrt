name: Build OpenWrt x86-64 NAS

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt branch or release tag
        default: openwrt-25.12
        required: true
      mihomo_tag:
        description: Mihomo release tag (amd64-compatible)
        default: v1.19.32
        required: true

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OWRT_REF: ${{ inputs.openwrt_ref }}
      MIHOMO_TAG: ${{ inputs.mihomo_tag }}
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates jq aria2 subversion time libelf-dev xsltproc \
            libxml-parser-perl zstd
          # Only remove preinstalled SDKs on this disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .

      - name: Fetch OpenWrt and feeds
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OWRT_REF" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Prefer PassWall's maintained core/dependency recipes over duplicates.
          ./scripts/feeds install -a -f -p passwall_packages
          ./scripts/feeds install -a -f -p passwall2
          git clone --depth 1 https://github.com/vernesong/OpenClash.git \
            /tmp/openclash-source
          mkdir -p package/custom
          cp -a /tmp/openclash-source/luci-app-openclash package/custom/
          mkdir -p "$GITHUB_WORKSPACE/output"
          {
            echo "OpenWrt ref: $OWRT_REF"
            echo "OpenWrt commit: $(git rev-parse HEAD)"
            echo "OpenClash commit: $(git -C /tmp/openclash-source rev-parse HEAD)"
            for feed in feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "$(basename "$feed"): $(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > "$GITHUB_WORKSPACE/output/sources.txt"
          cp feeds.conf.default "$GITHUB_WORKSPACE/output/feeds.conf.default"

      - name: Embed Mihomo core
        working-directory: openwrt
        run: |
          set -euo pipefail
          # Fetch a generic amd64 binary; no AVX/amd64-v3 requirement.
          python3 <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          tag = os.environ['MIHOMO_TAG']
          req = urllib.request.Request(
              'https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/' + tag,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              release = json.load(r)
          name = f'mihomo-linux-amd64-compatible-{tag}.gz'
          asset = next((a for a in release['assets'] if a['name'] == name), None)
          if asset is None:
              raise SystemExit(f'Required release asset missing: {name}')
          subprocess.run(['curl', '-fL', '--retry', '5', '--connect-timeout', '30',
                          asset['browser_download_url'], '-o', '/tmp/mihomo.gz'], check=True)
          data = pathlib.Path('/tmp/mihomo.gz').read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if asset.get('digest') and asset['digest'] != 'sha256:' + digest:
              raise SystemExit('Mihomo asset digest mismatch')
          dest = pathlib.Path('files/etc/openclash/core/clash_meta')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(gzip.decompress(data))
          dest.chmod(0o755)
          subprocess.run([str(dest.resolve()), '-v'], check=True)
          out = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'output'
          (out / 'mihomo-sha256.txt').write_text(f'{digest}  {name}\n')
          with (out / 'sources.txt').open('a') as f:
              f.write(f'Mihomo: {tag}\nAsset: {asset["browser_download_url"]}\n')
          PY

      - name: Configure firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_LUCI_LANG_en=y
          CONFIG_LUCI_LANG_zh_Hans=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox is not set
          CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y
          # CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin is not set
          EOF
          # Required selections also serve as a post-defconfig assertion list.
          cat > /tmp/required-packages <<'EOF'
          aria2
          luci-app-aria2
          ksmbd-server
          kmod-fs-ksmbd
          luci-app-ksmbd
          block-mount
          luci-app-mount
          xray-core
          luci-app-passwall2
          luci-app-openclash
          openvpn-openssl
          luci-app-openvpn
          luci-i18n-base-zh-cn
          luci-i18n-aria2-zh-cn
          luci-i18n-ksmbd-zh-cn
          luci-i18n-mount-zh-cn
          luci-i18n-openvpn-zh-cn
          luci-i18n-passwall2-zh-cn
          kmod-usb-core
          kmod-usb2
          kmod-usb3
          kmod-usb-storage
          kmod-usb-storage-uas
          kmod-scsi-core
          kmod-fs-exfat
          kmod-fs-ext4
          kmod-fs-vfat
          kmod-nls-utf8
          kmod-nls-cp437
          kmod-nls-iso8859-1
          e2fsprogs
          exfat-mkfs
          exfat-fsck
          fdisk
          lsblk
          blkid
          smartmontools
          kmod-tun
          kmod-nft-tproxy
          kmod-nft-socket
          kmod-nft-nat
          ca-bundle
          curl
          bash
          ip-full
          kmod-r8169
          kmod-igb
          kmod-igc
          kmod-e1000e
          EOF
          # Include every official theme actually present in this LuCI branch.
          for theme in feeds/luci/themes/luci-theme-*; do
            [ -f "$theme/Makefile" ] || continue
            basename "$theme" >> /tmp/required-packages
          done
          while IFS= read -r pkg; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done < /tmp/required-packages
          make defconfig
          while IFS= read -r pkg; do
            if ! grep -Fxq "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::error::Required package absent after defconfig: $pkg"
              exit 1
            fi
          done < /tmp/required-packages
          # Do not silently produce an image without a requested boot format.
          for sym in TARGET_x86_64 GRUB_IMAGES GRUB_EFI_IMAGES; do
            grep -Fxq "CONFIG_${sym}=y" .config
          done
          cp .config "$GITHUB_WORKSPACE/output/build.config"
          cp /tmp/required-packages "$GITHUB_WORKSPACE/output/required-packages.txt"
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-defaults <<'EOF'
          #!/bin/sh
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci set luci.main.lang='zh_cn'
          uci commit system
          uci commit luci
          # Import nodes/subscriptions and enable exactly one proxy in LuCI.
          uci -q set passwall2.@global[0].enabled='0'
          uci -q commit passwall2
          uci -q set openclash.config.enable='0'
          uci -q set openclash.config.core_type='Meta'
          uci -q commit openclash
          for service in passwall2 openclash aria2 ksmbd openvpn; do
            [ ! -x "/etc/init.d/$service" ] || "/etc/init.d/$service" disable
          done
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-defaults

      - name: Download source archives
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 V=s 2>&1 | tee "$GITHUB_WORKSPACE/output/download.log"

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          # Limit jobs to avoid exhausting RAM; retry serially for useful logs.
          if ! make -j2 2>&1 | tee "$GITHUB_WORKSPACE/output/build.log"; then
            make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/output/build-retry.log"
          fi

      - name: Collect and verify firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          target=bin/targets/x86/64
          test -n "$(find "$target" -maxdepth 1 -name '*combined*.img.gz' -print -quit)"
          cp "$target"/*combined*.img.gz "$GITHUB_WORKSPACE/output/"
          cp "$target"/*.manifest "$GITHUB_WORKSPACE/output/"
          # Confirm selected packages reached the final image, not only Kconfig.
          python3 <<'PY'
          import pathlib
          manifests = list(pathlib.Path('bin/targets/x86/64').glob('*.manifest'))
          assert manifests, 'No firmware manifests'
          required = pathlib.Path('/tmp/required-packages').read_text().splitlines()
          for manifest in manifests:
              installed = {line.split(' - ')[0] for line in manifest.read_text().splitlines()}
              missing = sorted(set(required) - installed)
              assert not missing, f'{manifest}: missing {missing}'
          PY
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.img.gz > firmware-sha256sums.txt

      - name: Upload firmware, configuration and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-nas-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
